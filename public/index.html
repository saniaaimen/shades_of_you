<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Turn a photo you love into brand colours and fonts.">
<meta name="theme-color" content="#0D0D0E">
<title>shades of you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Onest:wght@400;500;600&display=swap">
<style>
/* Layout: two fixed homes. Left column = wordmark, progress, one line, one button (sticky, never moves).
   Right = a framed stage edged like a paint-chip card: chip strip on top, punched hole, code band at the foot.
   Deliberately one dark look: the only colour on screen comes from the user's photo. */
:root{
  --bg:#0D0D0E; --panel:#141416; --tile:#1A1A1D; --line:#2A2A2E; --line2:#3B3B40;
  --ink:#F1F0EC; --soft:#A3A29D; --mute:#74736F; --warn:#F0B37A;
  --f-ui:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mark:"Instrument Serif","Iowan Old Style",Georgia,serif;
  --f-code:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
[hidden]{display:none!important}

.app{display:grid;grid-template-columns:320px minmax(0,1fr);gap:28px;max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:24px}

/* left column */
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 24px);align-self:start;display:flex;flex-direction:column;gap:22px;min-height:calc(100vh - 48px)}
.side.compact{gap:32px}
.side.compact .mark{font-size:26px}
.side.compact .oneliner{display:none}
.mono{font:500 11px/1.3 var(--f-code);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.brief{display:block;width:100%;padding:0;border:1px solid var(--line2);border-radius:10px;background:var(--panel);overflow:hidden;text-align:left;cursor:pointer;transition:border-color .15s}
.brief:hover{border-color:var(--soft)}
.brief-ph{position:relative;display:block;height:120px;background:var(--tile)}
.brief-ph img{width:100%;height:120px;object-fit:cover;display:block}
.chg{position:absolute;right:8px;bottom:8px;background:rgba(13,13,14,.72);color:#fff;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;box-shadow:0 0 0 1px rgba(255,255,255,.16)}
.brief-tx{display:grid;gap:4px;padding:12px}
.brief-w{font-size:15px;line-height:1.4;color:var(--ink);overflow-wrap:anywhere}
.brief-w.empty{color:var(--mute)}
.acts{margin-top:auto;display:grid;gap:10px}
.backlink{justify-self:center;border:0;background:none;color:var(--soft);font-size:13px;cursor:pointer;padding:4px 8px}
.backlink:hover{color:var(--ink)}
.mark{font:400 44px/0.95 var(--f-mark);letter-spacing:-.01em;margin:0;white-space:nowrap}
.mark i{font-style:italic}
.oneliner{margin:10px 0 0;color:var(--soft);font-size:14.5px;max-width:28ch}
.prog{display:grid;gap:8px}
.prog ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.prog li{height:3px;border-radius:2px;background:var(--line2)}
.prog li.done{background:var(--soft)}
.prog li.now{background:var(--ink)}

.line{margin:0;font-size:20px;line-height:1.3;font-weight:500;text-wrap:balance}
.fields{display:grid;gap:6px}
.field{display:grid;gap:6px}
.field label{font-size:13px;color:var(--soft)}
.field input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;font-size:15px;transition:border-color .15s}
.field input:focus{outline:none;border-color:var(--ink)}
.field input::placeholder{color:var(--mute)}
.tip{margin:0;font-size:12.5px;color:var(--mute)}
.for{margin:4px 0 0;font-size:13.5px;color:var(--soft);overflow-wrap:anywhere}
.for b{color:var(--ink);font-weight:500}
.for .textlink{font-size:13px;margin-left:6px}
.thumbrow{display:flex;align-items:center;gap:12px}
.thumbrow img{width:48px;height:48px;object-fit:cover;border-radius:8px;box-shadow:0 0 0 1px var(--line2)}
.btns{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.main{flex:1 1 100%;height:44px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;padding:0 22px;cursor:pointer;transition:opacity .15s}
.main:focus{outline:none}
.main:focus-visible{outline:2px solid var(--soft);outline-offset:3px}
.main:hover{opacity:.9}
.main:disabled{opacity:.4;cursor:not-allowed}
.btns.inline .main{flex:0 0 auto}
.textlink{border:0;background:none;padding:4px 0;color:var(--soft);font-size:13px;text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.textlink:hover{color:var(--ink)}
.msg{margin:0;font-size:13.5px;color:var(--warn)}
.msg:empty{display:none}

/* the framed stage */
.frame{border:1px solid var(--line2);border-radius:18px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-height:calc(100vh - 48px)}
.strip{display:grid;grid-template-columns:36px repeat(5,minmax(0,1fr));height:26px;border-bottom:1px solid var(--line2)}
.strip .hole{display:grid;place-items:center;border-right:1px solid var(--line2)}
.strip .hole i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line2),0 0 0 3px var(--bg)}
.strip b{border-right:2px solid var(--panel);transition:background-color .5s}
.strip b:last-child{border-right:0}
.pills{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 16px 0;min-height:46px}
.pills:empty{min-height:0;padding:0}
.tabs{display:flex;align-items:center;gap:22px;width:100%;padding:2px 0 0;min-width:0;flex-wrap:wrap}
.tab{border:0;background:none;padding:6px 0 7px;font:500 11px/1 var(--f-code);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer;box-shadow:inset 0 -1.5px 0 transparent}
.tab:hover{color:var(--soft)}
.tab[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -1.5px 0 var(--ink)}
.tabs .mono{margin-left:auto}
@media (max-width:440px){.tabs{gap:16px;flex-wrap:nowrap}.tab,.tabs .mono{letter-spacing:.1em}}
.making .say{position:absolute;left:0;right:0;bottom:12%;margin:0;text-align:center;font-size:15px;color:var(--ink);padding:0 16px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.pill{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.pill:hover{border-color:var(--ink);background:rgba(255,255,255,.05)}
.pill svg{width:14px;height:14px;vertical-align:-2px;margin-right:6px}
.dots{display:flex;align-items:center;gap:2px;margin-left:2px}
.dot{width:26px;height:26px;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.dot i{width:10px;height:10px;border-radius:50%;box-shadow:0 0 0 1.5px var(--soft);transition:transform .15s}
.dot[aria-pressed="true"] i{background:var(--ink);box-shadow:0 0 0 1.5px var(--ink);transform:scale(1.15)}
.dot:hover i{box-shadow:0 0 0 1.5px var(--ink)}
.body{flex:1;padding:16px;display:flex;flex-direction:column;min-width:0;position:relative}
.band{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line2);padding:9px 16px;font:500 10.5px/1.2 var(--f-code);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.band span:last-child{text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* step 1: drop */
.drop{flex:1;min-height:420px;display:grid;place-items:center;text-align:center;border:1.5px dashed var(--line2);border-radius:14px;cursor:pointer;transition:border-color .15s,background .15s;padding:24px}
.drop:hover,.drop.over{border-color:var(--ink);background:rgba(255,255,255,.03)}
.drop svg{width:36px;height:36px;margin:0 auto 14px;display:block;color:var(--soft)}
.drop b{display:block;font-size:20px;font-weight:500}
.drop span{display:block;color:var(--soft);font-size:14px;margin-top:4px}
#photo{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.preview{flex:1;display:grid;place-items:center;min-height:420px}
.preview img{max-width:100%;max-height:70vh;border-radius:12px;display:block}
.photo-box{position:relative;display:inline-block;line-height:0;max-width:100%}
.photo-ctl{position:absolute;top:10px;right:10px;display:flex;gap:6px;line-height:1.2}
.photo-ctl button{border:0;border-radius:999px;background:rgba(13,13,14,.78);color:#fff;font-size:13px;font-weight:600;padding:7px 12px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,255,255,.18)}
.photo-ctl button:hover{background:rgba(13,13,14,.92);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.photo-ctl .x{width:32px;padding:7px 0;font-size:17px;line-height:1}
/* grayscale check */
.gray-row{display:grid;gap:6px;justify-items:start}
.switch{display:inline-flex;align-items:center;gap:10px;border:0;background:none;padding:2px 0;font-size:13.5px;font-weight:500;cursor:pointer;color:var(--ink)}
.switch .track{width:34px;height:20px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--soft);position:relative;flex:none;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--soft);transition:transform .15s,background .15s}
.switch[aria-checked="true"] .track{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.switch[aria-checked="true"] .track::after{transform:translateX(14px);background:var(--bg)}
.gverdict{margin:0;font-size:12.5px;color:var(--soft)}
.gray #pv,.gray #swatches .c{filter:grayscale(1)}

/* step 2: making */
.making{flex:1;display:grid;place-items:center;min-height:420px;position:relative}
.making img{max-width:100%;max-height:70vh;border-radius:12px;opacity:.35;filter:saturate(.7);display:block}
.making .scan{position:absolute;width:70px;height:70px;border-radius:50%;border:2px solid var(--ink);opacity:.8;animation:roam 3.2s ease-in-out infinite}
@keyframes roam{0%{left:20%;top:25%}25%{left:62%;top:35%}50%{left:45%;top:62%}75%{left:28%;top:48%}100%{left:20%;top:25%}}

/* photo with sampler circles */
.ph{position:relative;display:inline-block;line-height:0;max-width:100%}
.ph img{max-width:100%;display:block;border-radius:10px}
.ring{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:4px solid var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.95),inset 0 0 0 1.5px rgba(0,0,0,.35),0 2px 8px rgba(0,0,0,.4);pointer-events:none}

/* step 3: reveal */
.reveal{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;cursor:pointer}
.reveal .ph img{max-height:66vh}
.rv-side{display:grid;gap:18px;min-width:0}
.reason{margin:0;color:var(--soft);font-size:15px;max-width:44ch}
.reason b{color:var(--ink);font-weight:500}
.sws{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.slot{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.slot .chip{width:44px;height:44px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22);transition:transform .25s,opacity .25s}
.slot .tx{display:grid;gap:1px;transition:opacity .25s}
.slot b{font-weight:500;font-size:15px}
.slot small{color:var(--soft);font:12.5px var(--f-code)}
.slot em{font-style:normal;font-size:12px;color:var(--warn)}
.slot.pending .chip{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2);transform:scale(.85)}
.slot.pending .tx{opacity:0}
.checknote{margin:0;font-size:12.5px;color:var(--mute)}
.flyer{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.9);pointer-events:none;z-index:3}

/* step 4: your looks */
.looks{display:grid;gap:16px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pv-wrap{display:grid;place-items:center;background:#0A0A0B;border:1px solid var(--line);border-radius:14px;padding:clamp(12px,3vw,28px);min-height:300px}
.pv{position:relative;overflow:hidden;border-radius:14px;box-shadow:0 20px 50px -24px rgba(0,0,0,.8)}
.pv-inner{position:absolute;left:0;top:0;transform-origin:0 0}
.pv-inner > div{position:absolute}
.meta{display:grid;gap:14px}

.meta .desc{margin:2px 0 0;color:var(--soft)}
.fixnote{font-size:13px;color:var(--mute)}
.fixnote:empty{display:none}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.swb{position:relative;display:grid;gap:8px;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--tile);cursor:pointer;text-align:left;min-width:0;transition:border-color .15s}
.swb:hover,.swb:focus-visible{border-color:var(--soft)}
.swb .c{height:54px;border-radius:8px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.swb b{font-size:13px;font-weight:500;display:block}
.swb code{font:12px var(--f-code);color:var(--soft)}
.swb .cp{position:absolute;top:14px;right:14px;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;opacity:0;transition:opacity .15s}
.swb .cp svg{width:13px;height:13px}
.swb:hover .cp,.swb:focus-visible .cp{opacity:1}
/* visual pickers */
.pickers{display:grid;gap:14px}
.prow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 14px;min-width:0}
.plabel{width:64px;align-self:center}
.cchips,.ftiles{display:flex;flex-wrap:wrap;align-items:flex-end}
.cchips{gap:8px}
.ftiles{gap:6px}
.pname{align-self:center;font-size:15px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.psub{margin:-6px 0 0 78px;font-size:13px;color:var(--soft)}
.psub:empty{display:none}
.cchip{position:relative;width:64px;height:44px;padding:0;border:0;border-radius:4px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:height .15s}
.cchip .top{flex:2;background:var(--p)}
.cchip .row{flex:0 0 12px;display:flex}
.cchip .row i{flex:1}
.cchip[aria-checked="true"]{height:50px;outline:2px solid var(--ink);outline-offset:2px}
.ftile{position:relative;width:40px;height:40px;border-radius:6px;border:1px solid var(--line2);background:transparent;color:var(--mute);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0;overflow:visible}
.ftile:hover{color:var(--soft)}
.ftile[aria-checked="true"]{border-color:var(--ink);color:var(--ink)}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:var(--bg);font:500 12px/1.2 var(--f-ui);letter-spacing:0;text-transform:none;padding:5px 8px;border-radius:6px;pointer-events:none;z-index:6}
.cchip[data-tip]{overflow:visible}
.cchip .top{border-radius:4px 4px 0 0}
.cchip .row{border-radius:0 0 4px 4px;overflow:hidden}
@media (max-width:560px){.plabel{width:100%}.psub{margin-left:0}}
.shufflers{display:grid;gap:6px}
.shuf{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
.shuf-l{width:62px;font-size:13px;color:var(--soft)}
.shuf-v{font-size:14px;min-width:0;overflow-wrap:anywhere}
.shuf-v b{font-weight:500}
.arrow{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:transparent;font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0 0 2px}
.arrow:hover{border-color:var(--ink)}
.shuf .dots{margin-left:6px}

/* step 5: download */
.sheet{margin:0;flex:1;display:grid;place-items:center;align-content:center;gap:10px}
.sheet img{max-width:100%;max-height:72vh;border-radius:12px;display:block;box-shadow:0 20px 50px -24px rgba(0,0,0,.8)}
.sheet figcaption{font-size:13px;color:var(--soft);text-align:center}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:13.5px;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px;padding-inline:16px;padding-block:16px}
  .side{position:static;gap:14px;min-height:0}
  .side.compact{gap:20px}
  .acts{margin-top:4px}
  .mark{font-size:34px}
  .oneliner{margin-top:6px;font-size:13.5px}
  .line{font-size:17px}
  .frame{min-height:0}
  .drop,.preview,.making{min-height:300px}
  .reveal{grid-template-columns:minmax(0,1fr);gap:18px}
  .reveal .ph{justify-self:center}
  .reveal .ph img{max-height:42vh}
}
@media (max-width:560px){
  .swatches{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="sec-mark">
      <h1 class="mark">shades <i>of</i> you</h1>
      <p class="oneliner">Your photo, turned into your brand's colours and fonts.</p>
    </div>
    <button class="brief" id="brief" type="button" hidden aria-label="Change your photo or brief">
      <span class="brief-ph"><img id="briefImg" alt=""><span class="chg">Change</span></span>
      <span class="brief-tx"><span class="mono">Your brief</span><span class="brief-w" id="briefText"></span></span>
    </button>
    <div class="prog" aria-label="Progress">
      <span class="mono" id="progLabel"></span>
      <ol id="progBars" aria-hidden="true"><li></li><li></li><li></li><li></li><li></li></ol>
    </div>
    <p class="line" id="line" aria-live="polite"></p>
    <form class="fields" id="fields" novalidate hidden>
      <div class="field"><label for="bwhat">What are you making?</label><input id="bwhat" maxlength="140" autocomplete="off"></div>
      <p class="tip" id="tip">Tell us what you're making for a tailored preview.</p>
    </form>
    <p class="msg" id="msg" role="alert"></p>
    <div class="acts">
      <div class="btns" id="btns">
        <button class="main" id="main" type="button"></button>
        <button class="textlink" id="copyCode" type="button" hidden>Copy code</button>
      </div>
      <button class="backlink" id="backLink" type="button" hidden>← Back</button>
    </div>
  </aside>

  <main class="frame" id="frame" aria-label="Stage">
    <div class="strip" id="strip" aria-hidden="true"><span class="hole"><i></i></span><b></b><b></b><b></b><b></b><b></b></div>
    <div class="pills" id="pills"></div>
    <div class="body" id="body"></div>
    <div class="band"><span>shades of you</span><span id="bandR"></span></div>
  </main>
</div>
<input type="file" id="photo" accept="image/jpeg,image/png,image/webp,image/gif">

/* ---------- colour maths ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isHex = h => /^#?[0-9a-f]{6}$/i.test(String(h||"").trim());
const norm = h => { h=String(h).trim(); return (h.startsWith("#")?h:"#"+h).toUpperCase(); };
const rgb = h => [1,3,5].map(i=>parseInt(norm(h).slice(i,i+2),16));
const lin = c => { c/=255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4); };
const unlin = c => { c = c<=0.0031308 ? 12.92*c : 1.055*Math.pow(c,1/2.4)-0.055; return Math.round(Math.min(1,Math.max(0,c))*255); };
const lum = h => { const [r,g,b]=rgb(h).map(lin); return .2126*r+.7152*g+.0722*b; };
const ratio = (a,b) => { const x=lum(a),y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
function toOk(h){
  const [r,g,b]=rgb(h).map(lin);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b), m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b), s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  const L=.2104542553*l+.7936177850*m-.0040720468*s, A=1.9779984951*l-2.4285922050*m+.4505937099*s, B=.0259040371*l+.7827717662*m-.8086757660*s;
  return {L, C:Math.hypot(A,B), H:Math.atan2(B,A)};
}
function fromOk({L,C,H}){
  const A=C*Math.cos(H), B=C*Math.sin(H);
  const l=(L+.3963377774*A+.2158037573*B)**3, m=(L-.1055613458*A-.0638541728*B)**3, s=(L-.0894841775*A-1.2914855480*B)**3;
  const r=4.0767416621*l-3.3077115913*m+.2309699292*s, g=-1.2684380046*l+2.6097574011*m-.3413193965*s, b=-.0041960771*l-.7034186147*m+1.7076147010*s;
  return "#"+[r,g,b].map(unlin).map(v=>v.toString(16).padStart(2,"0")).join("").toUpperCase();
}
/* Shift lightness (keeping the colour) until it reaches `need` against every background in `against`. */
function nudge(hex, against, need, dir){
  let o=toOk(hex), h=hex;
  for(let i=0;i<60 && against.some(b=>ratio(h,b)<need);i++){ o={...o,L:Math.min(1,Math.max(0,o.L+dir*0.01))}; h=fromOk(o); }
  return h;
}
const okDist = (a,b) => { const x=toOk(a), y=toOk(b); const ax=x.C*Math.cos(x.H)-y.C*Math.cos(y.H), bx=x.C*Math.sin(x.H)-y.C*Math.sin(y.H); return Math.hypot(x.L-y.L, ax, bx); };

/* ---------- the rules every colour set must pass ---------- */
const label = (h, text) => ratio("#FFFFFF",h) >= ratio(text,h) ? "#FFFFFF" : text;
function fails(sys){
  const out=[];
  if(ratio(sys.text,sys.page)<4.5 || ratio(sys.text,sys.card)<4.5) out.push("text");
  if(ratio(sys.brand,sys.page)<3) out.push("brandOnPage");
  if(ratio(label(sys.brand,sys.text),sys.brand)<4.5) out.push("brandLabel");
  if(ratio(label(sys.action,sys.text),sys.action)<4.5) out.push("actionLabel");
  if(ratio(sys.action,sys.card)<3) out.push("actionVisible");
  if(toOk(sys.action).L<0.32) out.push("actionDull");            // near-black buttons look heavy, not inviting
  if(!apart(sys.brand,sys.action)) out.push("distinct");
  return out;
}
const passes = sys => fails(sys).length===0;
function apart(a,b){
  const x=toOk(a), y=toOk(b);
  let dh=Math.abs(((x.H-y.H)*180/Math.PI)%360); if(dh>180) dh=360-dh;
  const otherFamily = x.C>0.04 && y.C>0.04 && dh>=35;
  return okDist(a,b)>=0.12 && (otherFamily || Math.abs(x.L-y.L)>=0.18);
}
const deg = r => ((r*180/Math.PI)+360)%360;
const badAction = h => { const o=toOk(h), d=deg(o.H); return o.C>0.12 && ((d>=18 && d<=33) || (d>=128 && d<=162)); }; // reads like error red / success green
function shift(hex,{dL=0,dH=0,kC=1}){ if(!dL && !dH && kC===1) return hex; const o=toOk(hex); return fromOk({L:Math.min(1,Math.max(.02,o.L+dL)), C:o.C*kC, H:o.H+dH*Math.PI/180}); }

/* Smallest change to one job's colour that makes the whole set pass. Returns the fitted option or null. */
function fitOption(role, opt, sys){
  const steps=[0]; for(let i=1;i<=15;i++) steps.push(i*0.02,-i*0.02);
  const hues = role==="action" ? [0,15,-15,30,-30,45,-45,60,-60] : [0];
  const tries=[];
  for(const dH of hues) for(const dL of steps) tries.push({dL,dH,cost:Math.abs(dL)+Math.abs(dH)/250});
  tries.sort((x,y)=>x.cost-y.cost);
  for(const t of tries){
    let cand, trial;
    if(role==="bg"){ cand={...opt, page:shift(opt.page,{dL:Math.max(0,t.dL)}), card:shift(opt.card,{dL:Math.max(0,t.dL)})}; if(t.dL<0) continue; trial={...sys,page:cand.page,card:cand.card}; }
    else { cand={...opt, hex:shift(opt.hex,t)}; trial={...sys,[role]:cand.hex}; if(role==="action" && !opt.claude && badAction(cand.hex)) continue; }
    if(passes(trial)){
      const moved = t.dL!==0 || t.dH!==0;
      // if we had to change it noticeably, give it an honest name
      if(moved && role!=="bg" && opt.name && okDist(opt.hex,cand.hex)>0.05 && !opt.claude) cand.name = describe(opt,cand,role);
      return {...cand, moved};
    }
  }
  return null;
}

/* Step 2: take Claude's picks, fix anything that fails, and say what changed in plain words. */
function settle(cols){
  const c={}; for(const k of ["brand","action","page","card","text"]) c[k]={...cols[k], hex:norm(cols[k].hex), note:""};
  const orig={}; for(const k in c) orig[k]=c[k].hex;
  c.text.hex = nudge(c.text.hex,[c.page.hex,c.card.hex],4.5,-1);
  c.brand.hex = nudge(c.brand.hex,[c.page.hex],3,-1);
  if(ratio(label(c.brand.hex,c.text.hex),c.brand.hex)<4.5) c.brand.hex = nudge(c.brand.hex,["#FFFFFF"],4.5,-1);
  const lab = h => label(h,c.text.hex);
  if(ratio(lab(c.action.hex),c.action.hex)<4.5){
    c.action.hex = lab(c.action.hex)==="#FFFFFF" ? nudge(c.action.hex,["#FFFFFF"],4.5,-1) : nudge(c.action.hex,[c.text.hex],4.5,1);
  }
  const readFixed = c.action.hex!==orig.action;
  const sys = () => ({brand:c.brand.hex,action:c.action.hex,page:c.page.hex,card:c.card.hex,text:c.text.hex});
  c.distinctFixed = false;
  if(!passes(sys())){
    const wasClose = fails(sys()).includes("distinct");
    const fixed = fitOption("action",{hex:c.action.hex},sys());
    if(fixed){ c.action.hex=fixed.hex; c.distinctFixed = wasClose; }
  }
  c.ok = passes(sys());
  if(c.text.hex!==orig.text) c.text.note="Adjusted a little darker so it's easier to read.";
  if(c.brand.hex!==orig.brand) c.brand.note="Adjusted a little darker so your logo reads clearly.";
  if(c.distinctFixed) c.action.note="Adjusted so your buttons stand out from your logo.";
  else if(readFixed || c.action.hex!==orig.action) c.action.note="Adjusted so the button text is easier to read.";
  c.action.label = lab(c.action.hex);
  c.brand.label = lab(c.brand.hex);
  return c;
}


/* ---- fonts: load from Google Fonts, and skip any pair that won't load ---- */
const FAMS = new Map();
const sheet = q => new Promise(res=>{
  const l=document.createElement("link"); l.rel="stylesheet"; l.href=`https://fonts.googleapis.com/css2?${q}&display=swap`;
  l.onload=()=>res(true); l.onerror=()=>{ l.remove(); res(false); }; document.head.appendChild(l);
});
function loadFamily(name){
  if(FAMS.has(name)) return FAMS.get(name);
  const fam = encodeURIComponent(name).replace(/%20/g,"+");
  const job = (async()=>{
    const heavy = await sheet(`family=${fam}:wght@400;700`);
    if(!heavy && !(await sheet(`family=${fam}`))) return null;
    try{
      const got = await Promise.race([document.fonts.load(`${heavy?700:400} 20px "${name}"`,"Aa"), new Promise(r=>setTimeout(()=>r(null),6000))]);
      if(!got || !got.length) return null;
    }catch{ return null; }
    return {heavy};
  })();
  job.then(r=>{ if(!r) FAMS.delete(name); });
  FAMS.set(name, job); return job;
}
async function loadPair(p){
  if(!p?.heading || !p?.body) return null;
  const [h,b] = await Promise.all([loadFamily(p.heading), loadFamily(p.body)]);
  return h && b ? {...p, hw: h.heavy ? 700 : 400} : null;
}

/* ---------- fonts: similar system fallback when a Google Font won't load ---------- */
const SERIFY = /serif|garamond|lora|gloock|gilda|bodoni moda|baskerville|caslon|bodoni|didot|merriweather|crimson|cormorant|spectral|cardo|domine|playfair|fraunces|prata|gelasio|newsreader|literata|young serif|instrument serif|abril|bitter|arvo|slab|zilla|vollkorn|alegreya(?! sans)|libre caslon|eb garamond|old standard|rufina|marcellus|cinzel/i;
const MONOY = /mono|code|courier/i;
const NARROWY = /bebas|anton|oswald|big shoulders|league gothic|fjalla/i;
function fstack(name){
  const n=String(name||"").replace(/"/g,"");
  const fb = MONOY.test(n) ? 'ui-monospace, Menlo, Consolas, monospace'
           : NARROWY.test(n) ? '"Arial Narrow", Impact, "Helvetica Neue", sans-serif'
           : SERIFY.test(n) && !/sans/i.test(n) ? 'Georgia, "Times New Roman", serif'
           : 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif';
  return n ? `"${n}", ${fb}` : fb;
}
/* Loads one pair's Google Fonts (heading at its tuned weight, body at 400 and 600) and resolves once they are usable or have fallen back.
   Remembers which request worked, so Copy code imports exactly that. */
function ensurePair(p){
  return p._ready ||= (async()=>{
    const fam=n=>encodeURIComponent(n).replace(/%20/g,"+");
    const tryQ=async(name,qs)=>{ for(const q of qs){ if(await sheet(`family=${fam(name)}${q}`)) return q; } return null; };
    const [hq,bq]=await Promise.all([
      tryQ(p.heading, p.headingWeight===400 ? [""] : [`:wght@${p.headingWeight}`, ""]),
      tryQ(p.body, [":wght@400;600", ":wght@400;700", ""]),
    ]);
    p.hq=hq; p.bq=bq; p.ok = hq!=null && bq!=null;
    await Promise.race([
      Promise.all([document.fonts.load(`${p.headingWeight} 32px ${fstack(p.heading)}`,"Aa"), document.fonts.load(`400 16px ${fstack(p.body)}`,"Aa"), document.fonts.load(`600 16px ${fstack(p.body)}`,"Aa")]).catch(()=>{}),
      new Promise(r=>setTimeout(r,6000)),
    ]);
  })();
}

/* ---------- contrast auto-fix, run on every look when the result arrives ---------- */
function fixLook(raw, i){
  const c={}; for(const k of ROLES) c[k]=norm(raw.colors[k]);
  const notes=[];
  const dark = toOk(c.background).L < 0.5;
  const t0=c.text;
  c.text = nudge(c.text,[c.background,c.surface],4.5, dark?1:-1);
  if(c.text!==t0) notes.push(dark ? "We lightened the text a little so it's easy to read." : "We darkened the text a little so it's easy to read.");
  let lab = isHex(raw.colors.primary_label) ? norm(raw.colors.primary_label) : null;
  if(!lab || ratio(lab,c.primary)<4.5){
    const best = ["#FFFFFF", c.text, c.background].sort((a,b)=>ratio(b,c.primary)-ratio(a,c.primary))[0];
    if(ratio(best,c.primary)>=4.5){ lab=best; notes.push("We changed the button text colour so it's easy to read."); }
    else{
      const darkLab = lum(c.text)<lum(c.background) ? c.text : c.background;
      const white = ratio("#FFFFFF",c.primary) >= ratio(darkLab,c.primary);
      lab = white ? "#FFFFFF" : darkLab;
      c.primary = white ? nudge(c.primary,["#FFFFFF"],4.5,-1) : nudge(c.primary,[darkLab],4.5,1);
      notes.push(white ? "We deepened the button colour a little so its text is easy to read." : "We lightened the button colour a little so its text is easy to read.");
    }
  }
  const a0=c.accent;
  c.accent = nudge(c.accent,[c.background],3, dark?1:-1);
  if(c.accent!==a0) notes.push(dark ? "We lightened the highlight a little so it stands out." : "We deepened the highlight a little so it stands out.");
  const fonts = { heading:String(raw.fonts?.heading||"").trim() || "Georgia", body:String(raw.fonts?.body||"").trim() || "system-ui" };
  return { name:String(raw.name||`Look ${i+1}`).trim().slice(0,32), description:String(raw.description||"").trim().slice(0,140), c, label:lab, fonts, hw:700, notes };
}
const words = (s,n) => String(s||"").trim().split(/\s+/).filter(Boolean).slice(0,n).join(" ");
function readResult(d){
  const looks = (Array.isArray(d?.looks) ? d.looks : []).filter(L => L && L.colors && ROLES.every(k=>isHex(L.colors[k]))).slice(0,5);
  if(!looks.length) return null;
  const type = TYPES.some(([t])=>t===d?.preview?.type) ? d.preview.type : "story";
  return {
    preview:(()=>{ const p=d?.preview||{}; const num=(v,dflt)=>{ v=Number(v); return isFinite(v)?Math.min(1,Math.max(0,v)):dflt; };
      const labels=(Array.isArray(p.labels)?p.labels:[]).map(l=>words(l,3)).filter(Boolean).slice(0,3);
      while(labels.length<3) labels.push(["Overview","Details","Contact"][labels.length]);
      return { type, title: words(p.title,4) || "Your project", headline: words(p.headline,8) || "Made from your photo",
        subline: words(p.subline,16) || "Colours and fonts taken straight from your photo.", button: words(p.button,4) || "Take a look",
        labels, card_title: words(p.card_title,5) || "A closer look", card_text: words(p.card_text,10) || "Every colour here comes from your photo.",
        focus:{ x:num(p.focus?.x,.5), y:num(p.focus?.y,.5) } }; })(),
    looks: looks.map(fixLook),
    pairs: (()=>{ const seen=new Set(), out=[];
      for(const v of (Array.isArray(d?.font_pairs)?d.font_pairs:[])){ const p=FONT_BY_ID[Number(v)]; if(p && !seen.has(p.id)){ seen.add(p.id); out.push(p); } }
      return (out.length?out:[14,1,6,16,22,26,11,9].map(i=>FONT_BY_ID[i])).slice(0,8); })()
  };
}

/* ---------- chrome ---------- */
function paintSide(){
  const show = APP.step>1 && !!APP.img;
  $("brief").hidden=!show;
  if(!show) return;
  if($("briefImg").src!==APP.img) $("briefImg").src=APP.img;
  const w = (APP.step>=3 && APP.made) ? APP.made.what : $("bwhat").value.trim();
  $("briefText").textContent = w || "No brief added";
  $("briefText").classList.toggle("empty", !w);
}
function paintChrome(){
  paintSide();
  $("progLabel").textContent = `Step ${APP.step} of 5 · ${STEP_NAMES[APP.step-1]}`;
  [...$("progBars").children].forEach((li,i)=> li.className = i+1<APP.step ? "done" : i+1===APP.step ? "now" : "");
  const L = APP.step>=3 ? cur() : null;
  const cols = L ? ROLES.map(k=>L.c[k]) : GREYS;
  [...$("strip").querySelectorAll("b")].forEach((b,i)=> b.style.backgroundColor = cols[i]);
  $("bandR").textContent = L ? `${L.name} · ${L.c.primary}` : APP.step===2 ? "Mixing" : "No. 001";
}

/* ---------- steps ---------- */
function go(step){
  clearReveal();
  APP.step=step; show();
  if(step===3) playReveal();
  if(step>1 && matchMedia("(max-width:900px)").matches) $("frame").scrollIntoView({block:"start", behavior: reduce ? "auto" : "smooth"});
}
function setPills(P){ $("pills").innerHTML = P.join(""); }
const pill = (t,a,extra="") => `<button class="pill" type="button" data-act="${a}" ${extra}>${t}</button>`;
function step1Pills(){ const P=[pill("See an example","example")]; if(sameAsMade()) P.push(pill("Back to my looks","tolooks")); return P; }

function show(){
  paintChrome();
  const st=APP.step, body=$("body");
  $("main").hidden=false; $("main").disabled=false; $("copyCode").hidden=true; $("fields").hidden=true;
  $("side").classList.toggle("compact", st>1); $("line").hidden = st>1;
  $("backLink").hidden = !(st===4 || st===5);
  $("btns").classList.remove("inline");
  body.onclick=null;
  if(st===1){
    $("line").textContent="Start with a photo you love.";
    $("fields").hidden=!APP.img;
    $("main").textContent="Make my looks";
    setPills(step1Pills());
    if(APP.img){
      body.innerHTML=`<div class="preview"><div class="photo-box"><img id="pv0" alt="Your photo">
        <div class="photo-ctl"><button type="button" data-ph="replace">Replace</button><button type="button" class="x" data-ph="remove" aria-label="Remove photo">×</button></div></div></div>`;
      $("pv0").src=APP.img;
    }
    else body.innerHTML=`<label class="drop" id="drop" for="photo" tabindex="0" role="button" aria-label="Add a photo"><div>${ICON_UP}<b>Drop a photo here</b><span>From your phone, Pinterest, anywhere.</span></div></label>`;
    syncTip();
  }
  if(st===2){
    $("line").textContent=SAY[0];
    $("main").hidden=true;
    setPills([pill("Stop","stop")]);
    body.innerHTML=`<div class="making"><img id="mk" alt=""><span class="scan" aria-hidden="true"></span><p class="say" id="say" aria-live="polite">${SAY[0]}</p></div>`; $("mk").src=APP.img;
  }
  if(st===3){
    $("line").textContent="Here's your first look.";
    $("main").hidden=true;
    setPills([pill("Skip","skip")]);
    body.innerHTML=revealHTML(); $("rvImg").src=APP.img;
    body.onclick=e=>{ if(!e.target.closest(".pill")) skipReveal(); };
  }
  if(st===4){
    $("line").textContent=`${APP.looks.length===5?"Five":APP.looks.length} looks from your photo.`;
    $("main").textContent="Download this look";
    $("pills").innerHTML=`<div class="tabs" role="tablist" aria-label="Preview type">${TYPES.map(([t,n])=>`<button class="tab" type="button" role="tab" data-type="${t}" aria-selected="${t===APP.type}" tabindex="${t===APP.type?0:-1}"${t===APP.preview.type?' title="Our pick for what you’re making"':""}>${n}</button>`).join("")}<span class="mono">Preview</span></div>`;
    body.innerHTML=looksHTML();
    APP.pairs.forEach(p=>ensurePair(p));                    // the 8 pairs on show as tiles
    drawPreview(); fillMeta();
  }
  if(st===5){
    $("line").textContent="Take this look with you.";
    $("main").textContent="Download";
    $("copyCode").hidden=false; $("btns").classList.add("inline");
    setPills([]);
    body.innerHTML=`<figure class="sheet"><img id="sheetImg" alt="Your look as an image"><figcaption id="sheetCap">Making your image…</figcaption></figure>`;
    buildSheet();
  }
}

/* ---------- step 1: photo + optional one-liner ---------- */
function syncTip(){ $("tip").hidden = !!$("bwhat").value.trim(); }
function rotateHints(){
  let i=0; $("bwhat").placeholder=HINTS[0];
  clearInterval(hintTimer);
  hintTimer=setInterval(()=>{ if($("bwhat").value) return; i=(i+1)%HINTS.length; $("bwhat").placeholder=HINTS[i]; }, 2600);
}
function setFile(f){
  if(!f) return;
  if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){ msg("That file isn't a photo we can read. Try a JPG or PNG."); return; }
  msg(""); APP.file=f;
  if(APP.step===2) ctl?.abort();                 // replacing mid-way stops the current request
  const fr=new FileReader();
  fr.onload=()=>{ APP.img=fr.result; APP.photoEl=null; if(APP.step!==1) go(1); else show(); };
  fr.readAsDataURL(f);
}

/* ---------- step 2: making ---------- */
function startSay(){ let i=0; stopSay(); sayTimer=setInterval(()=>{ i=Math.min(i+1,SAY.length-1); if(APP.step===2 && $("say")) $("say").textContent=SAY[i]; }, 2400); }
function stopSay(){ clearInterval(sayTimer); sayTimer=null; }
function dataURLtoFile(u){ const bin=atob(u.split(",")[1]); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new File([a],"photo.jpg",{type:(u.match(/^data:([^;]+)/)||[])[1]||"image/jpeg"}); }
async function make(){
  msg("");
  if(!APP.img){ $("photo").click(); return; }
  const what=$("bwhat").value.trim();
  if(sameAsMade()){ go(4); return; }                          // nothing changed: keep the looks
  if(!sample){ msg("Open this page in Claude to make your own. Or tap “See an example”."); return; }
  const file=APP.file || dataURLtoFile(APP.img);
  go(2); startSay();
  ctl=new AbortController();
  try{
    const d=await sample.json(what, {images:[file], signal:ctl.signal});
    const r=readResult(d); if(!r) throw {code:"invalid_json"};
    stopSay();
    if(APP.step!==2) return;                        // the photo was replaced while we waited
    await applyResult(r, APP.img, what);
  }catch(e){
    stopSay();
    if(APP.step!==2) return;
    go(1);
    if(e?.code==="cancelled") return;
    msg(e?.code==="rate_limited" ? "Lots of people right now. Try again in a minute." : e?.code==="offline" ? "You seem to be offline. Check your connection and try again." : "Something went wrong on our side. Try again.");
  }
}
async function applyResult(r, img, what, spots){
  APP.gray=false;
  APP.preview=r.preview; APP.type=r.preview.type; APP.looks=r.looks; APP.sel=0; APP.pairs=r.pairs; APP.fi=0; APP.img=img; APP.photoEl=null;
  ensurePair(APP.pairs[0]); if(APP.pairs[1]) ensurePair(APP.pairs[1]);   // only the pairs in view, plus the next one
  if(spots) APP.spots=Object.fromEntries(Object.entries(spots).map(([k,p])=>[k,{...p,added:false}]));
  else try{ APP.spots=await findSpots(img, APP.looks[0].c); }catch{ APP.spots=null; }
  APP.made={img, what};
  go(3);
}
function loadExample(){
  msg(""); APP.file=null; $("bwhat").value=EXAMPLE.one_liner; syncTip();
  applyResult(readResult(EXAMPLE), EXAMPLE_IMG, EXAMPLE.one_liner, EXAMPLE.spots);
}

/* ---------- step 3: reveal (Look 1) ---------- */
function revealHTML(){
  const L=APP.looks[0];
  return `<div class="reveal">
    <div class="ph" id="rvPh"><img id="rvImg" alt="Your photo"></div>
    <div class="rv-side">
      <p class="reason"><b>${esc(L.name)}.</b> ${esc(L.description)}</p>
      <ul class="sws">${ROLES.map(k=>`
        <li class="slot${reduce?"":" pending"}" data-k="${k}" style="--c:${L.c[k]}">
          <span class="chip"></span>
          <span class="tx"><b>${ROLE_NAME[k]}</b><small>${L.c[k]}</small>${APP.spots?.[k]?.added?`<em>Added, not in your photo</em>`:""}</span>
        </li>`).join("")}</ul>
      <p class="checknote">Every colour is checked so text stays easy to read.</p>
    </div>
  </div>`;
}
function ringEl(k){
  const sp=APP.spots?.[k]; if(!sp || sp.added) return null;
  const r=document.createElement("span"); r.className="ring";
  r.style.setProperty("--c", APP.looks[0].c[k]); r.style.left=(sp.x*100)+"%"; r.style.top=(sp.y*100)+"%";
  return r;
}
function playReveal(){
  const ph=$("rvPh");
  if(reduce){ ROLES.forEach(k=>{ const r=ringEl(k); if(r) ph.appendChild(r); }); later(()=>go(4),2600); return; }
  const gap=300;
  ROLES.forEach((k,i)=>{
    later(()=>{
      const slot=$("body").querySelector(`.slot[data-k="${k}"]`); const r=ringEl(k);
      if(!r){ later(()=>slot.classList.remove("pending"),380); return; }
      ph.appendChild(r);
      APP.anims.push(r.animate([{transform:"translateY(-46px) scale(1.5)",opacity:0},{transform:"none",opacity:1}],{duration:340,easing:"cubic-bezier(.2,.8,.3,1.15)"}));
      later(()=>fly(r,slot,k),380);
    }, 250+i*gap);
  });
  later(()=>go(4), 250+ROLES.length*gap+380+450+1400);
}
function fly(r,slot,k){
  const host=$("body"), sb=host.getBoundingClientRect(), a=r.getBoundingClientRect(), b=slot.querySelector(".chip").getBoundingClientRect();
  const x0=a.left+a.width/2-sb.left, y0=a.top+a.height/2-sb.top, x1=b.left+b.width/2-sb.left, y1=b.top+b.height/2-sb.top;
  const f=document.createElement("span"); f.className="flyer"; f.style.setProperty("--c",APP.looks[0].c[k]);
  f.style.left=x0+"px"; f.style.top=y0+"px"; host.appendChild(f);
  const an=f.animate([{transform:"translate(0,0) scale(1)"},{transform:`translate(${(x1-x0)/2}px,${(y1-y0)/2-40}px) scale(1.6)`,offset:.5},{transform:`translate(${x1-x0}px,${y1-y0}px) scale(2.45)`}],{duration:450,easing:"cubic-bezier(.5,0,.3,1)",fill:"forwards"});
  APP.anims.push(an); an.onfinish=()=>{ f.remove(); slot.classList.remove("pending"); };
}
function clearReveal(){ APP.timers.forEach(clearTimeout); APP.timers=[]; APP.anims.forEach(a=>{ try{a.cancel();}catch{} }); APP.anims=[]; document.querySelectorAll(".flyer").forEach(f=>f.remove()); }
function skipReveal(){ if(APP.step===3) go(4); }

/* ---------- where each colour sits in the photo ---------- */
function loadImage(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
function labOf(r,g,b){ r=lin(r); g=lin(g); b=lin(b);
  const l=Math.cbrt(.4122214708*r+.5363325363*g+.0514459929*b), m=Math.cbrt(.2119034982*r+.6806995451*g+.1073969566*b), s=Math.cbrt(.0883024619*r+.2817188376*g+.6299787005*b);
  return [.2104542553*l+.7936177850*m-.0040720468*s, 1.9779984951*l-2.4285922050*m+.4505937099*s, .0259040371*l+.7827717662*m-.8086757660*s]; }
async function findSpots(src, c){
  const im=await loadImage(src);
  const W=120, H=Math.max(1,Math.round(W*im.naturalHeight/im.naturalWidth));
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d",{willReadFrequently:true}); ctx.drawImage(im,0,0,W,H);
  const px=ctx.getImageData(0,0,W,H).data, N=W*H, lab=new Float32Array(N*3), dist=new Float32Array(N);
  for(let i=0;i<N;i++){ const v=labOf(px[i*4],px[i*4+1],px[i*4+2]); lab[i*3]=v[0]; lab[i*3+1]=v[1]; lab[i*3+2]=v[2]; }
  const out={}, taken=[];
  const pos=i=>[((i%W)+.5)/W,(Math.floor(i/W)+.5)/H];
  const inner=i=>{ const [x,y]=pos(i); return x>.06&&x<.94&&y>.06&&y<.94; };
  const clear=i=>inner(i) && taken.every(([tx,ty])=>{ const [x,y]=pos(i); return Math.hypot(x-tx,y-ty)>0.1; });
  for(const k of ROLES){
    const [L,A,B]=labOf(...rgb(c[k]));
    let best=1e9, bi=-1;
    for(let i=0;i<N;i++){ const dl=lab[i*3]-L, da=lab[i*3+1]-A, db=lab[i*3+2]-B; const d=Math.sqrt(dl*dl+da*da+db*db); dist[i]=d; if(d<best && inner(i)){ best=d; bi=i; } }
    if(bi<0) bi=0;
    let pick=bi;
    if(!clear(bi)){ let b2=1e9; for(let i=0;i<N;i++) if(dist[i]<best+0.06 && dist[i]<b2 && clear(i)){ b2=dist[i]; pick=i; } }
    const [x,y]=pos(pick), added=best>0.16;
    out[k]={x,y,d:best,added}; if(!added) taken.push([x,y]);
  }
  return out;
}

/* ---------- preview templates: one description, drawn on the page and into the image ---------- */
const PV_SIZE = { app:[360,760], website:[960,544], poster:[600,840], story:[400,760] };
const mctx = document.createElement("canvas").getContext("2d");
const measure = (t, font, ls=0) => { mctx.font=font; return mctx.measureText(t).width + ls*[...t].length; };
function wrap(text, font, maxW, max, ls=0){
  const out=[]; let line="";
  for(const w of String(text).split(/\s+/).filter(Boolean)){
    const t=line?line+" "+w:w;
    if(measure(t,font,ls)>maxW && line){ out.push(line); line=w; } else line=t;
  }
  if(line) out.push(line);
  if(out.length>max){ out.length=max; let l=out[max-1]; while(l.length>1 && measure(l+"…",font,ls)>maxW) l=l.slice(0,-1); out[max-1]=l+"…"; }
  return out;
}
/* Which part of the photo to show: cover the box, centred on the subject, never past the photo's edge. */
function cropRect(iw, ih, w, h, fx, fy){
  const k=Math.max(w/iw, h/ih), sw=w/k, sh=h/k;
  const sx=Math.min(iw-sw, Math.max(0, fx*iw - sw/2)), sy=Math.min(ih-sh, Math.max(0, fy*ih - sh/2));
  return {sx, sy, sw, sh, k};
}
const g8 = v => Math.ceil(v/8)*8;   // snap to the 8px grid
function buildPreview(type, L, pv, FP=curPair()){
  const [W,H]=PV_SIZE[type], c=L.c, lab=L.label, HF=FP.heading, BF=FP.body;
  const F=pv.focus||{x:.5,y:.5}, P=[];
  const rect=(x,y,w,h,r,fill,a=1,stroke=false)=>P.push({t:"r",x,y,w,h,r,fill,a,stroke});
  const circ=(x,y,r,fill,a=1)=>P.push({t:"c",x,y,r,fill,a});
  /* Flat artwork made only from this look's colours. Each look has its own arrangement; the highlight stays under ~10%. */
  const li=Math.max(0,APP.looks.indexOf(L))%5;
  const art=(x,y,w,h,r,ground=c.surface)=>{
    const S=[], s=Math.min(w,h), other = ground===c.surface ? c.background : c.surface;
    const band=(fy,fh,fill)=>S.push({k:"rect",x:x-2,y:y+fy*h,w:w+4,h:fh*h+(fy+fh>=1?4:0),fill});   // edge bands run past the frame so no seam shows
    const dot=(fx,fy,fr,fill)=>S.push({k:"circle",x:x+fx*w,y:y+fy*h,r:fr*s,fill});
    const arch=(fx,fw,fy,fill,end=1)=>S.push({k:"arch",x:x+fx*w,y:y+fy*h,w:fw*w,h:(end-fy)*h+(end>=1?4:0),fill});
    let g=ground;
    // Only the button colour may touch the artwork's edge, so the frame never melts into the page behind it.
    if(li===0){ arch(.30,.34,.16,c.primary); dot(.74,.60,.09,c.accent); }                              // Balanced: tall arch, small circle beside it
    if(li===1){ band(.70,.30,c.primary); dot(.40,.56,.26,c.primary); dot(.60,.42,.12,c.accent); }      // Light: two soft overlapping circles on a wide band
    if(li===2){ band(.44,.12,c.primary); band(.66,.22,c.primary); dot(.74,.24,.08,c.accent); }         // Dark: horizontal bands, one small accent circle
    if(li===3){ g=c.primary; arch(.16,.40,.20,other,.86); dot(.60,.38,.18,c.accent); }                 // Vivid: large circle overlapping an arch
    if(li===4){ arch(.43,.14,.26,c.primary); }                                                          // Subtle: a single slim arch on a plain surface
    P.push({t:"art",x,y,w,h,r,ground:g,shapes:S});
  };
  const font=(w,sz,fam)=>`${w} ${sz}px ${fstack(fam)}`;
  // a text block: returns its height. Headlines use line height 1.2, everything else 1.5.
  const text=(s,x,y,w,size,weight,fam,col,{lh=1.5,max=2,align="left",a=1}={})=>{
    const fnt=font(weight,size,fam), lines=wrap(s,fnt,w,max), h=Math.round(size*lh);
    lines.forEach((ln,i)=>P.push({t:"t",x,y:y+i*h,w,h,font:fnt,col,s:ln,align,a}));
    return lines.length*h;
  };
  // the headline, with the pair's tuning: weight, size, letter spacing, line height, capitals. Shrinks until every word fits.
  const head=(s,x,y,w,size,max)=>{
    const str=FP.uppercase?String(s).toUpperCase():String(s);
    let sz=Math.round(size*FP.sizeScale), lines, fnt, ls;
    const minSz=Math.round(size*0.6);
    for(;;){ fnt=font(FP.headingWeight,sz,HF); ls=FP.letterSpacingEm*sz;
      const all=wrap(str,fnt,w,99,ls);                         // every word, before any cut-off
      if((all.length<=max && all.every(l=>measure(l,fnt,ls)<=w+0.5)) || sz<=minSz){ lines=wrap(str,fnt,w,max,ls); break; }
      sz-=2; }
    const h=Math.round(sz*FP.lineHeight);
    lines.forEach((ln,i)=>P.push({t:"t",x,y:y+i*h,w,h,font:fnt,col:c.text,s:ln,align:"left",ls}));
    return lines.length*h;
  };
  const fitLines=(room,size)=>Math.max(0,Math.min(2,Math.floor(room/Math.round(size*1.5))));   // subline lines that fit the space left
  const tw=(s,size,weight)=>{ mctx.font=font(weight,size,BF); return Math.ceil(mctx.measureText(s).width); };
  const btn=(x,y,w,h,s,size)=>{ rect(x,y,w,h,h/2,c.primary); P.push({t:"t",x,y,w,h,font:font(600,size,BF),col:lab,s,align:"center"}); };
  const bw=(s,size,pad)=>g8(tw(s,size,600)+pad*2);
  rect(0,0,W,H,0,c.background);

  if(type==="app"){                       // 360 × 760, left edge 24
    const M=24, CW=312;
    P.push({t:"t",x:M,y:16,w:80,h:24,font:font(600,13,BF),col:c.text,s:"9:41",align:"left"});
    rect(M,56,32,32,8,c.primary);                                        // app logo
    text(pv.title,64,56,CW-40,17,600,BF,c.text,{lh:32/17,max:1});
    let x=M; pv.labels.forEach((l,i)=>{ const w=tw(l,14,i?400:600); text(l,x,104,w+2,14,i?400:600,BF,c.text,{max:1,a:i?.72:1}); if(i===0) rect(x,130,Math.min(w,32),3,2,c.accent); x+=w+24; });
    art(M,144,CW,240,16);                                                // artwork, 1.3 : 1
    let y=408; y+=head(pv.headline,M,y,CW,28,2); y=g8(y+16);
    const sl=fitLines(H-80-16-104-16-y,15); if(sl){ y+=text(pv.subline,M,y,CW,15,400,BF,c.text,{max:sl}); y=g8(y+16); }
    const start=P.length;
    const ch=g8(16+text(pv.card_title,M+16,y+16,CW-32,16,600,BF,c.text,{lh:1.2,max:1})+8+text(pv.card_text,M+16,y+16+24,CW-32,14,400,BF,c.text,{max:2})+16);
    P.splice(start,0,{t:"r",x:M,y,w:CW,h:ch,r:16,fill:c.surface,a:1});     // card sits behind its text
    btn(M,H-24-56,CW,56,pv.button,17);
  }
  if(type==="website"){                   // 960 × 544, left edge 48
    const M=48;
    rect(M,32,32,32,8,c.primary);
    text(pv.title,88,32,300,18,600,BF,c.text,{lh:32/18,max:1});
    let x=W-M; [...pv.labels].reverse().forEach(l=>{ const w=tw(l,15,400); x-=w; text(l,x,32,w,15,400,BF,c.text,{lh:32/15,max:1}); x-=32; });
    rect(M,112,32,4,2,c.accent);
    let y=128; y+=head(pv.headline,M,y,424,48,3); y=g8(y+16);
    y+=text(pv.subline,M,y,424,18,400,BF,c.text,{max:2}); y=g8(y+24);
    btn(M,y,bw(pv.button,16,24),48,pv.button,16);
    art(528,112,384,240,16);                                             // artwork, 16 : 10
    const cy=368, start=P.length;
    const ch=g8(16+text(pv.card_title,544,cy+16,352,17,600,BF,c.text,{lh:1.2,max:1})+8+text(pv.card_text,544,cy+16+24,352,15,400,BF,c.text,{max:1})+16);
    P.splice(start,0,{t:"r",x:528,y:cy,w:384,h:ch,r:16,fill:c.surface,a:1});
  }
  if(type==="poster"){                    // 600 × 840, left edge 40
    const M=40, CW=520;
    text(pv.title,M,40,240,16,700,BF,c.text,{lh:1.5,max:1});
    const lt=pv.labels.join("  ·  "), lw=tw(lt,14,400); text(lt,W-M-lw,40,lw,14,400,BF,c.text,{lh:24/14,max:1,a:.8});
    art(M,80,CW,400,8);                                                  // artwork, 1.3 : 1
    rect(M,504,48,4,2,c.accent);
    let y=520; y+=head(pv.headline,M,y,CW,48,2); y=g8(y+16);

  bmp.close?.(); return cv.toDataURL("image/jpeg", q);
}
function groqSampler(){
  return { json: async (oneLiner, {images, signal}) => {
    let res;
    try{
      const image = await shrinkPhoto(images[0]);
      res = await fetch(API_URL, { method:"POST", headers:{"content-type":"application/json"}, body:JSON.stringify({ one_liner:oneLiner, image }), signal });
    }catch(e){
      if(e?.name==="AbortError") throw {code:"cancelled"};
      throw {code: navigator.onLine===false ? "offline" : "network"};
    }
    const data = await res.json().catch(()=>null);
    if(!res.ok) throw {code: data?.error || "server_error"};
    return data;
  }};
}
