name: Readability
on:
  push:
  pull_request:
jobs:
  readability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/readability.mjs
